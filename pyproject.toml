[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mypackage"
version = "0.1.0"
description = "Internal package for core project functionality"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "User", email = "example@gmail.com" }
]
dependencies = [
    "requests>=2.28.0",
    "pandas>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black"
]

[project.scripts]
mypackage-cli = "mypackage.core:main_cli"
